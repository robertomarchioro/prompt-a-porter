name: Client Build
# Note: DEP0040 (punycode) e DEP0190 sono deprecazioni transitive di Node
# provenienti da dipendenze di build -- non richiedono azione in questo workflow.

on:
  push:
    branches: [main, feat/redesign-v08]
    paths:
      - "apps/client/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/client-build.yml"
      - "!apps/client/**/*.md"
      - "!apps/client/**/CHANGELOG.md"
      - "!apps/client/**/LICENSE"
      - "!packages/**/*.md"
  pull_request:
    branches: [main, feat/redesign-v08]
    paths:
      - "apps/client/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/client-build.yml"
      - "!apps/client/**/*.md"
      - "!apps/client/**/CHANGELOG.md"
      - "!apps/client/**/LICENSE"
      - "!packages/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @pap/client lint

      - name: Type check
        run: pnpm --filter @pap/client check

      - name: Test TypeScript con coverage (gate 70%)
        run: pnpm --filter @pap/client test:coverage

      # Build di produzione: svelte-check/vitest NON eseguono il bundle vite,
      # quindi una rottura del bundler (es. vite 8/rolldown che rifiuta la
      # forma a oggetto di manualChunks) passava la CI e rompeva solo la
      # release. Questo step la coglie prima del tag.
      - name: Build frontend (produzione)
        run: pnpm --filter @pap/client build:frontend

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@c0e9df88980754dd93e5833b8dcb1b304c1fe173 # 1.96.0
        with:
          toolchain: "1.96.0"
          components: llvm-tools-preview

      - name: Installa dipendenze sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      # Senza cache il runner ricompila da zero tutte le ~640 dipendenze del
      # lock, e lo fa DUE volte: `cargo check` e `cargo llvm-cov` usano flag
      # diversi (la coverage strumenta il codice), quindi cargo li tratta come
      # compilazioni distinte e non condivide gli artefatti fra i due step.
      # La cache non elimina quel doppio lavoro dentro il singolo run — elimina
      # il ricompilare le dipendenze a ogni run, per entrambi gli step.
      #
      # Stesso SHA già usato da release.yml: nessuna superficie nuova. Chiave
      # gestita dall'action su rustc + Cargo.lock + job, con potatura degli
      # artefatti del crate locale (che si ricompila comunque a ogni commit).
      #
      # Scope separato da quello di release.yml: una cache di verifica non
      # entra mai nella catena che produce i binari firmati.
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/client/src-tauri

      # cargo-llvm-cov: tooling di line/region coverage per Rust su stable.
      # Usa l'action ufficiale taiki-e per fetch del binario pre-compilato
      # (no compile, ~5 sec invece dei ~3 minuti di cargo install).
      - name: Installa cargo-llvm-cov
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.85.9 (cargo-llvm-cov)
        with:
          tool: cargo-llvm-cov

      # Punto cieco chiuso: il gate di coverage qui sotto gira su `--lib`, quindi
      # compila SOLO la libreria. Esempi e bench potevano marcire indefinitamente
      # senza che nulla segnalasse niente — ed è successo: `genera_dataset` e il
      # bench `ricerca_ibrida` erano rimasti all'API di rand 0.8 dopo il bump a
      # 0.10, con `cargo test` rotto in locale per chiunque e la CI verde (#562).
      # `check` invece di `build`: cattura la stessa classe di errori (import e
      # metodi spariti) in una frazione del tempo.
      - name: Compila tutti i target (lib, test, esempi, bench)
        working-directory: apps/client/src-tauri
        run: cargo check --all-targets --locked

      # Threshold floor 80% anti-regressione (M7 v1.0 PR-6).
      # Coverage attuale ~80.2% line post M7 PR-1..PR-6 (vault 91%, audit 93%,
      # cartelle 90%, libreria 92%, preferenze 91%, prompt 84%).
      # Embeddings/sync restano sotto soglia ma compensati dai moduli core.
      # Vedi docs/operativo/coverage.md.
      - name: Cargo test + coverage gate
        working-directory: apps/client/src-tauri
        run: cargo llvm-cov --lib --summary-only --fail-under-lines 80 --locked

  # La build multi-OS dei bundle è in .github/workflows/release.yml,
  # triggerata da tag `v*` per evitare di consumare minuti su ogni PR.
